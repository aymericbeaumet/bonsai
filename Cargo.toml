[package]
name = "bonsai-cli"
version = "0.1.1"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Ergonomic git worktree manager with a global worktree root"
repository = "https://github.com/aymericbeaumet/bonsai"
readme = "readme.md"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bonsai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
figment = { version = "0.10", features = ["toml", "env"] }
futures-util = "0.3"
glob = "0.3"
inquire = "0.9"
portable-pty = "0.9"
rand = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
shlex = "1"
skim = { version = "5.6", default-features = false }
slug = "0.1"
tabwriter = "1.4"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "fs", "poll"] }

[dev-dependencies]
assert_cmd = "2"
figment = { version = "0.10", features = ["test"] }
predicates = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
