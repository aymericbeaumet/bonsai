[package]
name = "bonsai-cli"
version = "0.1.0"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Ergonomic git worktree manager with a global worktree root"
repository = "https://github.com/aymericbeaumet/bonsai"
readme = "readme.md"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bonsai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
figment = { version = "0.10", features = ["toml", "env"] }
glob = "0.3"
inquire = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slug = "0.1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
figment = { version = "0.10", features = ["test"] }
predicates = "3"
tempfile = "3"

[profile.dev]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
