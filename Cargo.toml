[package]
name = "bonsai-cli"
version = "0.1.1"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Ergonomic git worktree manager with a global worktree root"
repository = "https://github.com/aymericbeaumet/bonsai"
readme = "readme.md"
include = ["bonsai-cli/", "skills/", "readme.md", "LICENSE"]
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bonsai"
path = "bonsai-cli/main.rs"

[[test]]
name = "cli"
path = "bonsai-cli/tests/cli.rs"

[[test]]
name = "safety"
path = "bonsai-cli/tests/safety.rs"

[dependencies]
anyhow = "1"
bonsai = { package = "bonsai-lib", path = "bonsai-lib", version = "0.1.1" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[workspace]
members = ["bonsai-lib"]
default-members = [".", "bonsai-lib"]
resolver = "3"

[profile.dev]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
