name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --manifest-path ../Cargo.toml
      - name: Install tmux for browser runtime tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-amd64, os: macos-15-intel }
          - { name: windows-amd64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install supported shells
        if: matrix.name == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh fish
          echo "REQUIRE_TEST_SHELLS=1" >> "$GITHUB_ENV"
      - run: cargo fmt --check
        if: matrix.name == 'linux-amd64'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v7
        if: matrix.name == 'linux-amd64'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v10
        if: matrix.name == 'linux-amd64'
        with:
          version: '0.11.15'
          python-version: '3.13'
          enable-cache: false
      - name: Real package-manager smoke tests
        if: matrix.name == 'linux-amd64'
        run: |
          uv python install 3.13
          cargo test --locked --test cli real_package_managers_ -- --ignored
      - name: Release terminal and benchmark smoke tests
        if: matrix.name == 'linux-amd64'
        run: |
          cargo build --release --locked
          python3 tests/terminal.py target/release/bonsai
          python3 scripts/benchmark.py --worktrees 1 --sessions 1000 --runs 3
