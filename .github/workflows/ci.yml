name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Each job installs only the tools it lists; tasks must not add the rest.
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-26.04, tools: "rust node python uv actionlint shellcheck github:fish-shell/fish-shell" }
          - { name: linux-arm64, os: ubuntu-26.04-arm, tools: rust }
          - { name: macos-arm64, os: macos-26, tools: rust }
          - { name: macos-amd64, os: macos-26-intel, tools: rust }
          - { name: windows-amd64, os: windows-2025, tools: rust }
          - { name: windows-arm64, os: windows-11-arm, tools: rust }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked ${{ matrix.tools }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install supported shells
        if: matrix.name == 'linux-amd64'
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi
          echo "REQUIRE_TEST_SHELLS=1" >> "$GITHUB_ENV"
      # Linux runs `mise run check`, split into its tasks so each reports on
      # its own; every platform lints and tests.
      - run: mise run fmt-check
        if: matrix.name == 'linux-amd64'
      - run: mise run actionlint
        if: matrix.name == 'linux-amd64'
      - run: mise run release-helper-tests
        if: matrix.name == 'linux-amd64'
      - run: mise run lint
      - run: mise run test
      - run: mise run package
        if: matrix.name == 'linux-amd64'
      - name: Package-manager, terminal, and benchmark smoke tests
        if: matrix.name == 'linux-amd64'
        run: mise run smoke
