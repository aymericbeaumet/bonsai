[package]
name = "bonsai-lib"
version = "0.1.1"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Git worktree manager used by the bonsai CLI"
repository = "https://github.com/aymericbeaumet/bonsai"
readme = "../readme.md"
keywords = ["git", "worktree"]
categories = ["development-tools"]

[lib]
name = "bonsai"
path = "lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
glob = "0.3.4"
inquire = "0.9.4"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
ratatui = "0.30.2"
rayon = "1.12.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
shlex = "2.0.1"
skim = { version = "5.9.0", default-features = false }
slug = "0.1.6"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tabwriter = "1.4.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs"] }
signal-hook = "0.4.6"

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
