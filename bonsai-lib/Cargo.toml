[package]
name = "bonsai-lib"
version = "0.1.1"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Git worktree manager used by the bonsai CLI"
repository = "https://github.com/aymericbeaumet/bonsai"
readme = "../readme.md"
keywords = ["git", "worktree"]
categories = ["development-tools"]

[lib]
name = "bonsai"
path = "lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
figment = { version = "0.10", features = ["toml", "env"] }
glob = "0.3"
inquire = "0.9"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
shlex = "2"
skim = { version = "5.7", default-features = false }
slug = "0.1"
tabwriter = "1.4"
tempfile = "3"
thiserror = "2"
toml = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
